[package]
name = "fishtime"
version = "5.5.0"
description = "A lightweight local work timer"
authors = ["FishTime"]
edition = "2021"

[lib]
name = "fishtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSFont", "NSFontDescriptor", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "objc2-core-foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
