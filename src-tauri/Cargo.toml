[package]
name = "fishtime"
version = "5.4.0"
description = "A lightweight local work timer"
authors = ["FishTime"]
edition = "2021"

[lib]
name = "fishtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
